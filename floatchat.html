<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloatChat - AI Ocean Intelligence</title>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* All previous CSS remains the same, adding new styles for conversation controls */
    
    .user-profile {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 1000;
    }

    .profile-btn {
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 8px 16px;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .profile-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent);
    }

    .profile-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: rgba(15, 15, 35, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 180px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: none;
    }

    .profile-dropdown.show {
      display: block;
      animation: dropdownFadeIn 0.3s ease;
    }

    @keyframes dropdownFadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-item {
      padding: 12px 16px;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .user-info {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.875rem;
    }

    .user-email {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Conversation Controls */
    .conversation-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .conversation-btn {
      background: rgba(23, 23, 51, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.3s ease;
    }

    .conversation-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent);
    }

    /* Fix chat scrolling */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 0;
      min-height: 0;
    }

    /* Enhanced message styles for better scrolling */
    .message {
      max-width: 85%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      animation: messageSlideIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean-blue) 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      animation: messageSlideInRight 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes messageSlideInRight {
      from {
        opacity: 0;
        transform: translateX(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .message.ai {
      background: linear-gradient(135deg, var(--surface-light) 0%, rgba(23, 23, 51, 0.9) 100%);
      border: 1px solid var(--border);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: messageSlideInLeft 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes messageSlideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* Loading indicator for chat - FIXED POSITION */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: linear-gradient(135deg, var(--surface-light) 0%, rgba(23, 23, 51, 0.9) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px;
      margin: 8px 0;
      max-width: 85%;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typingBounce 1.4s ease-in-out infinite both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* STABLE ARGO float markers - NO DANCING */
    .argo-marker {
      transition: all 0.3s ease;
    }
    .argo-marker:hover {
      transform: scale(1.2);
      filter: brightness(1.2);
    }

    /* Rest of your existing CSS remains exactly the same */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0a0a1a;
      --secondary: #1a1a2e;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --surface: #0f0f23;
      --surface-light: #171733;
      --text-primary: #ffffff;
      --text-secondary: #a3a3d3;
      --text-muted: #5252a2;
      --border: #262644;
      --border-light: #404066;
      --success: #10b981;
      --warning: #f59e0b;
      --ocean-blue: #1e40af;
      --ocean-teal: #0891b2;
      --ocean-purple: #7c3aed;
      --glow-blue: rgba(37, 99, 235, 0.6);
      --glow-teal: rgba(8, 145, 178, 0.4);
      --glow-purple: rgba(124, 58, 237, 0.3);
    }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(-45deg, #0a0a1a, #1a1a2e, #0f0f23, #171733);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, var(--glow-blue) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--glow-teal) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, var(--glow-purple) 0%, transparent 50%);
      opacity: 0.1;
      animation: floatingGlow 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatingGlow {
      0%, 100% { 
        transform: scale(1) rotate(0deg);
        opacity: 0.1;
      }
      33% { 
        transform: scale(1.1) rotate(120deg);
        opacity: 0.15;
      }
      66% { 
        transform: scale(0.9) rotate(240deg);
        opacity: 0.08;
      }
    }

    /* Sleek scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, var(--accent), var(--ocean-teal));
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(45deg, var(--accent-light), var(--ocean-blue));
    }

    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 48px 0;
      position: relative;
      animation: headerFadeIn 1.2s ease-out;
    }

    @keyframes headerFadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 0%, #3b82f6 50%, #0891b2 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: textShimmer 3s ease-in-out infinite;
      position: relative;
    }

    @keyframes textShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header h1::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .header p {
      font-size: 1.125rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: -0.01em;
      animation: fadeInUp 1s ease-out 0.3s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header a {
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: fadeInUp 1s ease-out 0.6s both;
    }

    .header a:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--ocean-teal), transparent);
      animation: lineGlow 2s ease-in-out infinite;
    }

    @keyframes lineGlow {
      0%, 100% { opacity: 0.5; width: 100px; }
      50% { opacity: 1; width: 200px; }
    }

    /* Main Grid */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 70vh;
      animation: contentSlideIn 1s ease-out 0.4s both;
    }

    @keyframes contentSlideIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel {
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: panelFadeIn 0.8s ease-out both;
    }

    .panel:nth-child(2) {
      animation-delay: 0.2s;
    }

    @keyframes panelFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), rgba(8, 145, 178, 0.5), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.05) 0%, rgba(8, 145, 178, 0.05) 50%, rgba(124, 58, 237, 0.05) 100%);
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .panel:hover::before {
      opacity: 1;
    }

    .panel:hover::after {
      opacity: 1;
    }

    .panel:hover {
      border-color: var(--border-light);
      transform: translateY(-4px) scale(1.01);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.3),
        0 0 40px rgba(37, 99, 235, 0.1);
    }

    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .panel-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
      animation: headerSweep 8s infinite;
    }

    @keyframes headerSweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .panel-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .message-sender {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Map search controls */
    .map-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 200px;
    }

    .map-search-input {
      flex: 1;
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
      min-width: 150px;
    }

    .map-search-input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    .map-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--glow-blue);
      transform: translateY(-1px);
    }

    .btn-map-search {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean-blue) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
    }

    .btn-map-search:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--ocean-teal) 100%);
      transform: translateY(-1px) scale(1.05);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* Map Panel */
    #map {
      height: 100%;
      background: var(--surface);
      position: relative;
    }

    #map::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 30% 70%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(8, 145, 178, 0.1) 0%, transparent 50%);
      pointer-events: none;
      opacity: 0.5;
      animation: mapGlow 10s ease-in-out infinite;
    }

    @keyframes mapGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* Controls */
    .controls {
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
      animation: controlsFadeIn 1s ease-out 0.8s both;
    }

    @keyframes controlsFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .controls::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(37, 99, 235, 0.02) 0%, rgba(8, 145, 178, 0.02) 100%);
      pointer-events: none;
    }

    .input-group {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    #userInput {
      width: 100%;
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 1rem;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      outline: none;
      position: relative;
    }

    #userInput::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 
        0 0 0 3px var(--glow-blue),
        0 8px 25px rgba(37, 99, 235, 0.2);
      transform: translateY(-2px);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean-blue) 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--ocean-teal) 100%);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 12px 30px rgba(37, 99, 235, 0.4),
        0 0 30px rgba(37, 99, 235, 0.2);
    }

    .btn:active {
      transform: translateY(-1px) scale(1.01);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--surface-light) 0%, rgba(23, 23, 51, 0.9) 100%);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: linear-gradient(135deg, var(--surface) 0%, rgba(38, 38, 68, 0.9) 100%);
      border-color: var(--border-light);
      box-shadow: 
        0 8px 25px rgba(255, 255, 255, 0.1),
        0 0 20px rgba(59, 130, 246, 0.1);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 
        0 12px 30px rgba(16, 185, 129, 0.4),
        0 0 30px rgba(16, 185, 129, 0.2);
    }

    .select-wrapper {
      position: relative;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 40px 16px 20px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.4s ease;
      outline: none;
      background-image: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow-blue);
      transform: translateY(-2px);
    }

    .select-wrapper::after {
      content: '▼';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.75rem;
      pointer-events: none;
      transition: transform 0.3s ease;
    }

    .select-wrapper:hover::after {
      transform: translateY(-50%) scale(1.1);
      color: var(--accent);
    }

    /* Loading State */
    .loading {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: loadingSpin 1s linear infinite;
      margin-left: 8px;
    }

    @keyframes loadingSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Status Indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--success), #10b981);
      animation: statusPulse 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    @keyframes statusPulse {
      0%, 100% { 
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      }
      50% { 
        opacity: 0.6;
        transform: scale(1.2);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
      }
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(59, 130, 246, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .particle:nth-child(odd) {
      background: rgba(8, 145, 178, 0.4);
    }

    .particle:nth-child(3n) {
      background: rgba(124, 58, 237, 0.3);
    }

    /* Search marker styling */
    .search-marker {
      font-size: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: searchMarkerBounce 1s ease-out;
    }

    @keyframes searchMarkerBounce {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .main-content {
        grid-template-columns: 1fr;
        height: auto;
        gap: 32px;
      }
      
      .panel {
        min-height: 60vh;
      }

      .panel-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .map-controls {
        min-width: 100%;
        justify-content: stretch;
      }
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 16px;
        gap: 16px;
      }
      
      .header {
        padding: 32px 0;
      }
      
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      
      .input-group {
        min-width: auto;
      }
      
      .btn, select {
        padding: 14px 20px;
      }
      
      #chat {
        padding: 16px;
      }
      
      .message {
        max-width: 90%;
        padding: 12px 16px;
      }

      .panel-header {
        padding: 16px;
      }

      .map-search-input {
        font-size: 0.875rem;
        padding: 10px 12px;
      }

      .user-profile {
        top: 16px;
        right: 16px;
      }
    }

    /* Custom Leaflet Styles */
    .leaflet-container {
      background: var(--surface) !important;
      font-family: 'SF Pro Display', sans-serif !important;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(23, 23, 51, 0.95) !important;
      backdrop-filter: blur(10px) !important;
      color: var(--text-primary) !important;
      border-radius: 12px !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
    }

    .leaflet-popup-tip {
      background: rgba(23, 23, 51, 0.95) !important;
      border: 1px solid var(--border) !important;
    }

    /* Ocean wave animation */
    .ocean-waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(180deg, transparent, rgba(8, 145, 178, 0.05));
      pointer-events: none;
      z-index: 0;
    }

    .ocean-waves::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 20px;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        rgba(37, 99, 235, 0.1) 10px,
        transparent 20px
      );
      animation: waveMove 15s linear infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div class="ocean-waves"></div>
  
  <!-- User Profile Dropdown -->
  <div class="user-profile">
    <div class="profile-btn" id="profileBtn">
      <span>👤</span>
      <span id="userName">Ocean Explorer</span>
      <span>▼</span>
    </div>
    <div class="profile-dropdown" id="profileDropdown">
      <div class="user-info">
        <div class="user-name" id="dropdownUserName">Ocean Explorer</div>
        <div class="user-email" id="dropdownUserEmail">explorer@floatchat.com</div>
      </div>
      <div class="dropdown-item" onclick="showProfile()">
        <span>👤</span>
        Explorer Profile
      </div>
      <div class="dropdown-item" onclick="exportConversation()">
        <span>💾</span>
        Export Log
      </div>
      <div class="dropdown-item" onclick="clearConversation()">
        <span>🗑️</span>
        Clear Log
      </div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="logout()" style="color: #ef4444;">
        <span>🚪</span>
        Return to Shore
      </div>
    </div>
  </div>
  
  <div class="app-container">
    <header class="header">
      <h1>FloatChat</h1>
      <p>AI Ocean Intelligence Platform</p>

    </header>

    <div class="controls">
      <div class="input-group">
        <input 
          id="userInput" 
          placeholder="Ask about ocean data, ARGO floats, marine discoveries..."
          autocomplete="off"
        />
      </div>
      
      <button class="btn" onclick="sendMessage()">
        Send
        <div class="loading" id="loadingSpinner"></div>
      </button>

      <div class="select-wrapper">
        <select id="mode">
          <option value="novice">Novice Explorer</option>
          <option value="proficient">Experienced Explorer</option>
          <option value="expert">Master Explorer</option>
        </select>
        <select id="language">
          <option value="english">English</option>
          <option value="hindi">Hindi</option>
          <option value="tamil">Tamil</option>
          <option value="telugu">Telugu</option>
          <option value="kannada">Kannada</option>
        </select>
      </div>

      <div class="conversation-controls">
        <button class="conversation-btn" onclick="clearConversation()" title="Clear Conversation">
          🗑️ Clear
        </button>
        <button class="conversation-btn" onclick="exportConversation()" title="Export Chat">
          💾 Export
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="panel chat-panel">
        <div class="panel-header">
          <h2 class="panel-title">Ocean Exploration Assistant</h2>
          <div class="status">
            <div class="status-dot"></div>
            Ready for Discovery
          </div>
        </div>
        <div id="chat">
          <!-- Typing indicator will be inserted here when needed -->
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Global ARGO Network</h2>
          <div class="map-controls">
            <input 
              id="mapSearch" 
              placeholder="Search ocean locations..."
              class="map-search-input"
            />
            <button class="btn-map-search" onclick="searchLocation()">
              🔍
            </button>
            <button class="btn-map-search" onclick="refreshArgoData()" title="Refresh ARGO Data">
              🔄
            </button>
          </div>
        </div>
        <div id="map"></div>
      </div>
    </main>
  </div>

  <script>
    // ==================== CONVERSATION MANAGER ====================
    class ConversationManager {
      constructor() {
        this.history = [];
        this.maxHistory = 20;
        this.systemPrompt = `You are FloatChat, an AI Ocean Data Assistant for Ocean Explorers.
- Always address users as "Ocean Explorer" or "fellow Ocean Explorer"
- Create an immersive ocean exploration experience
- Speak with wonder and excitement about marine discoveries
- Use ocean-themed metaphors and analogies
- Focus on ARGO floats, ocean data, climate, salinity, temperature, and marine research
- Maintain conversation context and remember previous questions
- Adapt your answers to the user's expertise level and preferred language
- Be conversational but professional, with a sense of adventure and discovery`;

        // Ocean explorer rank system
        this.userRank = 'Novice Ocean Explorer';
        this.messageCount = 0;
      }

      addMessage(role, content) {
        this.history.push({ role, content, timestamp: Date.now() });
        this.manageContext();
        this.save();
        this.updateUserRank();
      }

      manageContext() {
        if (this.history.length > this.maxHistory) {
          const systemMsg = this.history.find(msg => msg.role === 'system');
          const recentMessages = this.history.slice(-18);
          
          this.history = [];
          if (systemMsg) this.history.push(systemMsg);
          this.history.push(...recentMessages);
        }
      }

      updateUserRank() {
        this.messageCount++;
        if (this.messageCount >= 50) {
          this.userRank = 'Master Ocean Explorer';
        } else if (this.messageCount >= 25) {
          this.userRank = 'Advanced Ocean Explorer';
        } else if (this.messageCount >= 10) {
          this.userRank = 'Experienced Ocean Explorer';
        }
        return this.userRank;
      }

      getConversationPrompt(mode, language, userQuery) {
        const modeContext = this.getModeContext(mode, language);
        const conversationContext = this.formatConversation();
        
        return `${this.systemPrompt}

Current User Rank: ${this.userRank}
${modeContext}

Conversation History:
${conversationContext}

Ocean Explorer: ${userQuery}

Assistant:`;
      }

      getModeContext(mode, language) {
        const modeContexts = {
          novice: `User Level: Novice Ocean Explorer - just starting their ocean journey
Response Style: Simple, inspiring explanations in ${language}
Use analogies: Compare ocean concepts to familiar things
Focus: Spark curiosity and wonder about the oceans
Example: "Just like exploring a new city, let's navigate the ocean's mysteries together!"`,

          proficient: `User Level: Experienced Ocean Explorer - familiar with marine concepts  
Response Style: Technical but engaging in ${language}
Include: Scientific terms with ocean-themed explanations
Focus: Deepen understanding of ocean systems
Example: "As we dive deeper into these ocean currents, you'll discover..."`,

          expert: `User Level: Master Ocean Explorer - professional/researcher level
Response Style: Detailed technical explanations in ${language} with collaborative tone
Include: Advanced terminology and research references
Focus: Collaborative exploration and analysis
Example: "Fellow ocean researcher, let's analyze this data from the ARGO network..."`
        };
        
        return modeContexts[mode] || modeContexts.novice;
      }

      formatConversation() {
        if (this.history.length === 0) return 'No previous conversation.';
        
        return this.history
          .filter(msg => msg.role !== 'system')
          .map(msg => `${msg.role === 'user' ? 'Ocean Explorer' : 'Assistant'}: ${msg.content}`)
          .join('\n\n');
      }

      save() {
        localStorage.setItem('floatChatConversation', JSON.stringify(this.history));
      }

      load() {
        const saved = localStorage.getItem('floatChatConversation');
        if (saved) {
          this.history = JSON.parse(saved);
          // Calculate message count for rank
          this.messageCount = this.history.filter(msg => msg.role === 'user').length;
          this.updateUserRank();
        }
      }

      clear() {
        this.history = [];
        this.messageCount = 0;
        this.userRank = 'Novice Ocean Explorer';
        this.save();
      }

      getStats() {
        const userMessages = this.history.filter(msg => msg.role === 'user').length;
        const aiMessages = this.history.filter(msg => msg.role === 'assistant').length;
        return { 
          total: this.history.length, 
          user: userMessages, 
          ai: aiMessages,
          rank: this.userRank,
          nextRank: this.getNextRank()
        };
      }

      getNextRank() {
        if (this.messageCount < 10) return 'Experienced Ocean Explorer (10 messages)';
        if (this.messageCount < 25) return 'Advanced Ocean Explorer (25 messages)';
        if (this.messageCount < 50) return 'Master Ocean Explorer (50 messages)';
        return 'Maximum rank achieved!';
      }
    }

    // ==================== GLOBAL VARIABLES ====================
    const conversationManager = new ConversationManager();
    let currentUser = null;
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const loadingSpinner = document.getElementById('loadingSpinner');
    let map;
    let argoMarkers = [];

    // ==================== USER SESSION MANAGEMENT ====================
    function initializeUserSession() {
      const userData = localStorage.getItem('floatChatUser');
      if (userData) {
        currentUser = JSON.parse(userData);
        document.getElementById('userName').textContent = currentUser.name || 'Ocean Explorer';
        document.getElementById('dropdownUserName').textContent = currentUser.name || 'Ocean Explorer';
        document.getElementById('dropdownUserEmail').textContent = currentUser.email || 'explorer@floatchat.com';
        
        if (currentUser.preferences) {
          document.getElementById('mode').value = currentUser.preferences.expertise || 'novice';
          document.getElementById('language').value = currentUser.preferences.preferredLanguage || 'english';
        }
      } else {
        // Create default ocean explorer profile
        currentUser = {
          name: 'Ocean Explorer',
          email: 'explorer@floatchat.com',
          preferences: {
            expertise: 'novice',
            preferredLanguage: 'english'
          }
        };
        localStorage.setItem('floatChatUser', JSON.stringify(currentUser));
      }
    }

    // Profile dropdown functionality
    document.getElementById('profileBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('profileDropdown');
      dropdown.classList.toggle('show');
    });

    document.addEventListener('click', function() {
      document.getElementById('profileDropdown').classList.remove('show');
    });

    function logout() {
      localStorage.removeItem('floatChatUser');
      window.location.href = 'index.html';
    }

    function showProfile() {
      const stats = conversationManager.getStats();
      alert(`🌊 Ocean Explorer Profile 🌊

Name: ${currentUser.name}
Rank: ${stats.rank}
Messages Sent: ${stats.user}
Next Rank: ${stats.nextRank}

Expertise Level: ${currentUser.preferences?.expertise || 'Novice Explorer'}
Preferred Language: ${currentUser.preferences?.preferredLanguage || 'English'}

Total Explorations: ${stats.total}
AI Guidance Sessions: ${stats.ai}

Continue your ocean journey to unlock higher ranks!`);
    }

    // ==================== CHAT FUNCTIONALITY ====================
    function addMessage(type, content) {
      // Remove any existing typing indicator
      const existingTyping = document.querySelector('.typing-indicator');
      if (existingTyping) {
        existingTyping.remove();
      }
      
      const message = document.createElement('div');
      message.className = `message ${type}`;
      
      const sender = document.createElement('div');
      sender.className = 'message-sender';
      sender.textContent = type === 'user' ? 'Ocean Explorer' : 'Assistant';
      
      const text = document.createElement('div');
      text.textContent = content;
      
      message.appendChild(sender);
      message.appendChild(text);
      chat.appendChild(message);
      
      // Smooth scroll animation
      setTimeout(() => {
        chat.scrollTo({
          top: chat.scrollHeight,
          behavior: 'smooth'
        });
      }, 100);

      // Add glow effect
      setTimeout(() => {
        message.style.boxShadow = type === 'user' 
          ? '0 0 20px rgba(37, 99, 235, 0.3)' 
          : '0 0 20px rgba(255, 255, 255, 0.1)';
        setTimeout(() => {
          message.style.boxShadow = '';
        }, 2000);
      }, 100);
    }

    function showTypingIndicator() {
      // Remove any existing typing indicator first
      const existingTyping = document.querySelector('.typing-indicator');
      if (existingTyping) {
        existingTyping.remove();
      }
      
      const typingIndicator = document.createElement('div');
      typingIndicator.className = 'typing-indicator';
      typingIndicator.style.display = 'block';
      
      const typingDots = document.createElement('div');
      typingDots.className = 'typing-dots';
      
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'typing-dot';
        typingDots.appendChild(dot);
      }
      
      typingIndicator.appendChild(typingDots);
      chat.appendChild(typingIndicator);
      
      // Scroll to show typing indicator
      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: 'smooth'
      });
    }

    async function sendMessage() {
      const query = userInput.value.trim();
      const mode = document.getElementById('mode').value;
      const language = document.getElementById('language').value;

      if (!query) return;

      // Add user message immediately
      addMessage('user', query);
      userInput.value = '';

      loadingSpinner.style.display = 'block';
      
      // Show typing indicator AFTER user message
      setTimeout(() => {
        showTypingIndicator();
      }, 100);

      // Add user message to conversation history
      conversationManager.addMessage('user', query);

      try {
        const prompt = conversationManager.getConversationPrompt(mode, language, query);
        const response = await puter.ai.chat(prompt, { model: "gpt-4o" });
        
        // Add AI response to history
        conversationManager.addMessage('assistant', response);
        
        addMessage('ai', response);
      } catch (error) {
        console.error('Chat error:', error);
        addMessage('ai', 'Ahoy, Ocean Explorer! I seem to have hit rough waters with the connection. Please try again as we navigate these digital seas together!');
      } finally {
        loadingSpinner.style.display = 'none';
      }
    }

    function clearConversation() {
      if (confirm('Clear your ocean exploration log? This will start a fresh journey.')) {
        conversationManager.clear();
        const chat = document.getElementById('chat');
        chat.innerHTML = '';
        
        const welcomeMessage = `Ahoy, Ocean Explorer! 🌊

Welcome back to FloatChat! Your exploration log has been cleared, and we're ready for a new ocean adventure!

What mysteries of the deep shall we uncover today?`;
        
        addMessage('ai', welcomeMessage);
        conversationManager.addMessage('assistant', welcomeMessage);
      }
    }

    function exportConversation() {
      const conversationText = conversationManager.history
        .filter(msg => msg.role !== 'system')
        .map(msg => `${msg.role === 'user' ? 'OCEAN EXPLORER' : 'ASSISTANT'}: ${msg.content}`)
        .join('\n\n');
      
      const blob = new Blob([conversationText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ocean-exploration-log-${new Date().toISOString().split('T')[0]}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      addMessage('ai', '🌊 Exploration log successfully exported! Your ocean discoveries are now saved for future reference.');
    }

    // ==================== MAP & ARGO DATA ====================
    function initializeMap() {
        map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([20, 0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);
    }

    async function loadRealArgoData() {
        try {
            argoMarkers.forEach(marker => map.removeLayer(marker));
            argoMarkers = [];

            const argoData = await fetchRealArgoFloats();
            
            if (argoData && argoData.length > 0) {
                displayArgoFloats(argoData);
            } else {
                createRealisticArgoData();
            }
        } catch (error) {
            console.error('Error loading ARGO data:', error);
            createRealisticArgoData();
        }
    }

    async function fetchRealArgoFloats() {
        const endpoints = [
            'https://corsproxy.io/?https://argovis.colorado.edu/catalog/argo_profiles?limit=50',
            'https://api.allorigins.win/raw?url=https://argovis.colorado.edu/catalog/argo_profiles?limit=50'
        ];

        for (const endpoint of endpoints) {
            try {
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    return processArgoData(data);
                }
            } catch (error) {
                console.warn(`Failed with endpoint ${endpoint}:`, error);
                continue;
            }
        }
        return null;
    }

    function processArgoData(data) {
        if (Array.isArray(data)) {
            return data.map(float => ({
                lat: float.latitude || float.lat,
                lon: float.longitude || float.lon,
                platform_number: float.platform_number || float.id || 'Unknown',
                temperature: float.temperature || (Math.random() * 15 + 5).toFixed(1),
                salinity: float.salinity || (Math.random() * 5 + 33).toFixed(1),
                pressure: float.pressure || (Math.random() * 50 + 10).toFixed(0),
                last_transmission: float.date || float.timestamp || new Date().toISOString()
            })).filter(float => float.lat && float.lon);
        }
        return null;
    }

    function displayArgoFloats(floats) {
        floats.forEach((float, index) => {
            setTimeout(() => {
                const marker = L.circleMarker([float.lat, float.lon], {
                    radius: 8,
                    fillColor: getColorByTemperature(float.temperature),
                    color: '#ffffff',
                    weight: 2,
                    opacity: 0.9,
                    fillOpacity: 0.8,
                    className: 'argo-marker'
                });

                const popupContent = `
                    <div style="font-family: 'SF Pro Display', sans-serif; font-size: 0.875rem; min-width: 220px;">
                        <div style="font-weight: 600; margin-bottom: 8px; color: #3b82f6; border-bottom: 1px solid rgba(59, 130, 246, 0.3); padding-bottom: 4px;">
                            ARGO Float ${float.platform_number}
                        </div>
                        <div style="margin-bottom: 4px;"><strong>Position:</strong> ${float.lat.toFixed(2)}°, ${float.lon.toFixed(2)}°</div>
                        <div style="margin-bottom: 4px;"><strong>Temperature:</strong> ${float.temperature}°C</div>
                        <div style="margin-bottom: 4px;"><strong>Salinity:</strong> ${float.salinity} PSU</div>
                        <div style="margin-bottom: 4px;"><strong>Pressure:</strong> ${float.pressure} dbar</div>
                        ${float.last_transmission ? `<div style="margin-bottom: 4px;"><strong>Last Update:</strong> ${new Date(float.last_transmission).toLocaleDateString()}</div>` : ''}
                        <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(59, 130, 246, 0.3); font-size: 0.75rem; color: #a3a3d3;">
                            Live oceanographic data
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                
                marker.on('click', function() {
                    map.setView([float.lat, float.lon], 5);
                });
                
                marker.addTo(map);
                argoMarkers.push(marker);
            }, index * 100);
        });
    }

    function createRealisticArgoData() {
        const realisticFloats = [
            // North Atlantic
            { lat: 45.5, lon: -45.2, platform_number: '6901881', temperature: 12.4, salinity: 35.1, pressure: 15 },
            { lat: 38.2, lon: -30.5, platform_number: '6901882', temperature: 18.7, salinity: 36.2, pressure: 8 },

    function getColorByTemperature(temp) {
        if (temp < 0) return '#4cc9f0';
        if (temp < 5) return '#4895ef';
        if (temp < 10) return '#4361ee';
        if (temp < 15) return '#3a0ca3';
        if (temp < 20) return '#7209b7';
        if (temp < 25) return '#f72585';
        if (temp < 30) return '#ff6b6b';
        return '#ff0000';
    }

    function refreshArgoData() {
        addMessage('ai', '🌊 Scanning the oceans for updated ARGO float data... The global observation network is being refreshed!');
        loadRealArgoData();
    }

    async function searchLocation() {
        const query = document.getElementById('mapSearch').value.trim();
        if (!query) return;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
            const data = await response.json();
            
            if (data.length > 0) {
                const { lat, lon } = data[0];
                map.flyTo([parseFloat(lat), parseFloat(lon)], 6, {
                    animate: true,
                    duration: 1.5
                });
                
                const searchMarker = L.marker([parseFloat(lat), parseFloat(lon)], {
                    icon: L.divIcon({
                        className: 'search-marker',
                        html: '📍',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).addTo(map);
                
                searchMarker.bindPopup(`
                    <div style="font-family: 'SF Pro Display', sans-serif; font-size: 0.875rem;">
                        <div style="font-weight: 600; margin-bottom: 8px; color: #3b82f6;">Exploration Target</div>
                        <div>${data[0].display_name}</div>
                    </div>
                `).openPopup();
                
                setTimeout(() => {
                    map.removeLayer(searchMarker);
                }, 10000);
            }
        } catch (error) {
            console.error('Search error:', error);
        }
    }

    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', function() {
        initializeUserSession();
        conversationManager.load();
        
        if (conversationManager.history.length === 0) {
            conversationManager.addMessage('system', 'Ocean exploration assistant initialized for Ocean Explorer');
        }

        if (conversationManager.history.filter(msg => msg.role !== 'system').length === 0) {
            setTimeout(() => {
                const welcomeMessage = `Ahoy, Ocean Explorer! 🌊

Welcome to FloatChat - your portal to the world's oceans! I'm your AI marine science companion, here to help you:

• Track ARGO floats across the global ocean network
• Analyze real-time oceanographic data  
• Explore marine ecosystems and climate patterns
• Discover the secrets of our blue planet

I see you're starting as a ${conversationManager.userRank}. As we journey through ocean data together, you'll unlock new ranks and discoveries!

What corner of our vast ocean shall we explore first?`;
                
                addMessage('ai', welcomeMessage);
                conversationManager.addMessage('assistant', welcomeMessage);
            }, 1200);
        }

        // Initialize map and load ARGO data
        initializeMap();
        loadRealArgoData();

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.body.style.opacity = '0';
        setTimeout(() => {
            document.body.style.transition = 'opacity 0.6s ease';
            document.body.style.opacity = '1';
        }, 100);
    });

    // Create floating particles
    function createParticles() {
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.animation = `floatParticle ${Math.random() * 20 + 10}s linear infinite`;
            document.body.appendChild(particle);
        }
    }

    const particleStyle = document.createElement('style');
    particleStyle.textContent = `
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(${Math.random() * 200 - 100}px);
                opacity: 0;
            }
        }
    `;
    document.head.appendChild(particleStyle);
    createParticles();
  </script>
