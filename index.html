<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloatChat - AI Ocean Intelligence</title>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0a0a1a;
      --secondary: #1a1a2e;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --surface: #0f0f23;
      --surface-light: #171733;
      --text-primary: #ffffff;
      --text-secondary: #a3a3d3;
      --text-muted: #5252a2;
      --border: #262644;
      --border-light: #404066;
      --success: #10b981;
      --warning: #f59e0b;
      --ocean-blue: #1e40af;
      --ocean-teal: #0891b2;
      --ocean-purple: #7c3aed;
      --glow-blue: rgba(37, 99, 235, 0.6);
      --glow-teal: rgba(8, 145, 178, 0.4);
      --glow-purple: rgba(124, 58, 237, 0.3);
    }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(-45deg, #0a0a1a, #1a1a2e, #0f0f23, #171733);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, var(--glow-blue) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--glow-teal) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, var(--glow-purple) 0%, transparent 50%);
      opacity: 0.1;
      animation: floatingGlow 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatingGlow {
      0%, 100% { 
        transform: scale(1) rotate(0deg);
        opacity: 0.1;
      }
      33% { 
        transform: scale(1.1) rotate(120deg);
        opacity: 0.15;
      }
      66% { 
        transform: scale(0.9) rotate(240deg);
        opacity: 0.08;
      }
    }

    /* Sleek scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, var(--accent), var(--ocean-teal));
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(45deg, var(--accent-light), var(--ocean-blue));
    }

    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 48px 0;
      position: relative;
      animation: headerFadeIn 1.2s ease-out;
    }

    @keyframes headerFadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 0%, #3b82f6 50%, #0891b2 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: textShimmer 3s ease-in-out infinite;
      position: relative;
    }

    @keyframes textShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header h1::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .header p {
      font-size: 1.125rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: -0.01em;
      animation: fadeInUp 1s ease-out 0.3s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header a {
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: fadeInUp 1s ease-out 0.6s both;
    }

    .header a:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--ocean-teal), transparent);
      animation: lineGlow 2s ease-in-out infinite;
    }

    @keyframes lineGlow {
      0%, 100% { opacity: 0.5; width: 100px; }
      50% { opacity: 1; width: 200px; }
    }

    /* Main Grid */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 70vh;
      animation: contentSlideIn 1s ease-out 0.4s both;
    }

    @keyframes contentSlideIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel {
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: panelFadeIn 0.8s ease-out both;
    }

    .panel:nth-child(2) {
      animation-delay: 0.2s;
    }

    @keyframes panelFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), rgba(8, 145, 178, 0.5), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.05) 0%, rgba(8, 145, 178, 0.05) 50%, rgba(124, 58, 237, 0.05) 100%);
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .panel:hover::before {
      opacity: 1;
    }

    .panel:hover::after {
      opacity: 1;
    }

    .panel:hover {
      border-color: var(--border-light);
      transform: translateY(-4px) scale(1.01);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.3),
        0 0 40px rgba(37, 99, 235, 0.1);
    }

    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .panel-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
      animation: headerSweep 8s infinite;
    }

    @keyframes headerSweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .panel-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    /* Map search controls */
    .map-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 200px;
    }

    .map-search-input {
      flex: 1;
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
      min-width: 150px;
    }

    .map-search-input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    .map-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--glow-blue);
      transform: translateY(-1px);
    }

    .btn-map-search {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean-blue) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
    }

    .btn-map-search:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--ocean-teal) 100%);
      transform: translateY(-1px) scale(1.05);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      animation: messageSlideIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .message:hover::before {
      left: 100%;
    }

    .message.user {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean-blue) 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      animation: messageSlideInRight 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes messageSlideInRight {
      from {
        opacity: 0;
        transform: translateX(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .message.ai {
      background: linear-gradient(135deg, var(--surface-light) 0%, rgba(23, 23, 51, 0.9) 100%);
      border: 1px solid var(--border);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: messageSlideInLeft 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes messageSlideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .message-sender {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Map Panel */
    #map {
      height: 100%;
      background: var(--surface);
      position: relative;
    }

    #map::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 30% 70%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(8, 145, 178, 0.1) 0%, transparent 50%);
      pointer-events: none;
      opacity: 0.5;
      animation: mapGlow 10s ease-in-out infinite;
    }

    @keyframes mapGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* Controls */
    .controls {
      background: rgba(15, 15, 35, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
      animation: controlsFadeIn 1s ease-out 0.8s both;
    }

    @keyframes controlsFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .controls::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(37, 99, 235, 0.02) 0%, rgba(8, 145, 178, 0.02) 100%);
      pointer-events: none;
    }

    .input-group {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    #userInput {
      width: 100%;
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 1rem;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      outline: none;
      position: relative;
    }

    #userInput::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 
        0 0 0 3px var(--glow-blue),
        0 8px 25px rgba(37, 99, 235, 0.2);
      transform: translateY(-2px);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean-blue) 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--ocean-teal) 100%);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        0 12px 30px rgba(37, 99, 235, 0.4),
        0 0 30px rgba(37, 99, 235, 0.2);
    }

    .btn:active {
      transform: translateY(-1px) scale(1.01);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--surface-light) 0%, rgba(23, 23, 51, 0.9) 100%);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: linear-gradient(135deg, var(--surface) 0%, rgba(38, 38, 68, 0.9) 100%);
      border-color: var(--border-light);
      box-shadow: 
        0 8px 25px rgba(255, 255, 255, 0.1),
        0 0 20px rgba(59, 130, 246, 0.1);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 
        0 12px 30px rgba(16, 185, 129, 0.4),
        0 0 30px rgba(16, 185, 129, 0.2);
    }

    .select-wrapper {
      position: relative;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: rgba(23, 23, 51, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 40px 16px 20px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.4s ease;
      outline: none;
      background-image: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow-blue);
      transform: translateY(-2px);
    }

    .select-wrapper::after {
      content: '▼';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.75rem;
      pointer-events: none;
      transition: transform 0.3s ease;
    }

    .select-wrapper:hover::after {
      transform: translateY(-50%) scale(1.1);
      color: var(--accent);
    }

    /* Loading State */
    .loading {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: loadingSpin 1s linear infinite;
      margin-left: 8px;
    }

    @keyframes loadingSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Status Indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--success), #10b981);
      animation: statusPulse 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    @keyframes statusPulse {
      0%, 100% { 
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      }
      50% { 
        opacity: 0.6;
        transform: scale(1.2);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
      }
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(59, 130, 246, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .particle:nth-child(odd) {
      background: rgba(8, 145, 178, 0.4);
    }

    .particle:nth-child(3n) {
      background: rgba(124, 58, 237, 0.3);
    }

    /* Search marker styling */
    .search-marker {
      font-size: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: searchMarkerBounce 1s ease-out;
    }

    @keyframes searchMarkerBounce {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .main-content {
        grid-template-columns: 1fr;
        height: auto;
        gap: 32px;
      }
      
      .panel {
        min-height: 60vh;
      }

      .panel-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .map-controls {
        min-width: 100%;
        justify-content: stretch;
      }
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 16px;
        gap: 16px;
      }
      
      .header {
        padding: 32px 0;
      }
      
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      
      .input-group {
        min-width: auto;
      }
      
      .btn, select {
        padding: 14px 20px;
      }
      
      #chat {
        padding: 16px;
      }
      
      .message {
        max-width: 90%;
        padding: 12px 16px;
      }

      .panel-header {
        padding: 16px;
      }

      .map-search-input {
        font-size: 0.875rem;
        padding: 10px 12px;
      }
    }

    /* Custom Leaflet Styles */
    .leaflet-container {
      background: var(--surface) !important;
      font-family: 'SF Pro Display', sans-serif !important;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(23, 23, 51, 0.95) !important;
      backdrop-filter: blur(10px) !important;
      color: var(--text-primary) !important;
      border-radius: 12px !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
    }

    .leaflet-popup-tip {
      background: rgba(23, 23, 51, 0.95) !important;
      border: 1px solid var(--border) !important;
    }

    /* Ocean wave animation */
    .ocean-waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(180deg, transparent, rgba(8, 145, 178, 0.05));
      pointer-events: none;
      z-index: 0;
    }

    .ocean-waves::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 20px;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        rgba(37, 99, 235, 0.1) 10px,
        transparent 20px
      );
      animation: waveMove 15s linear infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div class="ocean-waves"></div>
  
  <div class="app-container">
    <header class="header">
      <h1>FloatChat</h1>
      <p>AI Ocean Intelligence Platform</p>
      <a href="app.html">
        Try Upload Mode →
      </a>
    </header>

    <div class="controls">
      <div class="input-group">
        <input 
          id="userInput" 
          placeholder="Ask about ocean data, ARGO floats, marine science..."
          autocomplete="off"
        />
      </div>
      
      <button class="btn" onclick="sendMessage()">
        Send
        <div class="loading" id="loadingSpinner"></div>
      </button>

      <div class="select-wrapper">
        <select id="mode">
          <option value="novice">Novice</option>
          <option value="proficient">Proficient</option>
          <option value="expert">Expert</option>
        </select>
        <select id="language">
          <option value="english">English</option>
          <option value="hindi">Hindi</option>
          <option value="tamil">Tamil</option>
          <option value="telugu">Telugu</option>
          <option value="kannada">Kannada</option>
        </select>
      </div>

      <button class="btn btn-success" onclick="exportReport()">
        Export
      </button>
    </div>

    <main class="main-content">
      <div class="panel chat-panel">
        <div class="panel-header">
          <h2 class="panel-title">AI Assistant</h2>
          <div class="status">
            <div class="status-dot"></div>
            Online
          </div>
        </div>
        <div id="chat"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">ARGO Network</h2>
          <div class="map-controls">
            <input 
              id="mapSearch" 
              placeholder="Search ocean locations..."
              class="map-search-input"
            />
            <button class="btn-map-search" onclick="searchLocation()">
              🔍
            </button>
          </div>
        </div>
        <div id="map"></div>
      </div>
    </main>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // Create floating particles
    function createParticles() {
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.animation = `floatParticle ${Math.random() * 20 + 10}s linear infinite`;
        document.body.appendChild(particle);
      }
    }

    // Add particle animation
    const particleStyle = document.createElement('style');
    particleStyle.textContent = `
      @keyframes floatParticle {
        0% {
          transform: translateY(100vh) translateX(0px);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) translateX(${Math.random() * 200 - 100}px);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(particleStyle);

    createParticles();

    // Initialize with welcome message
    setTimeout(() => {
      addMessage('ai', 'Welcome to FloatChat. I can help you explore oceanographic data, analyze ARGO float measurements, and answer questions about marine science.');
    }, 1200);

    function addMessage(type, content) {
      const message = document.createElement('div');
      message.className = `message ${type}`;
      
      const sender = document.createElement('div');
      sender.className = 'message-sender';
      sender.textContent = type === 'user' ? 'You' : 'Assistant';
      
      const text = document.createElement('div');
      text.textContent = content;
      
      message.appendChild(sender);
      message.appendChild(text);
      chat.appendChild(message);
      
      // Smooth scroll animation
      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: 'smooth'
      });

      // Add a subtle glow effect to new messages
      setTimeout(() => {
        message.style.boxShadow = type === 'user' 
          ? '0 0 20px rgba(37, 99, 235, 0.3)' 
          : '0 0 20px rgba(255, 255, 255, 0.1)';
        setTimeout(() => {
          message.style.boxShadow = '';
        }, 2000);
      }, 100);
    }

    const SYSTEM_PROMPT = `
You are FloatChat, an AI Ocean Data Assistant.
- Always answer as a marine science expert.
- Focus on ARGO floats, ocean data, climate, salinity, temperature, and marine research.
- If the user just says hi/hello, greet them naturally: e.g. "Hi! How can I help with ocean data today?"
- Do not explain English words unless explicitly asked.
- Adapt your answers to the chosen mode (novice, proficient, expert).
`;

async function sendMessage() {
  const query = userInput.value.trim();
  const mode = document.getElementById('mode').value;
  const language = document.getElementById('language').value;

  if (!query) return;

  addMessage('user', query);
  userInput.value = '';

  loadingSpinner.style.display = 'block';
  const sendButton = document.querySelector('.btn');
  sendButton.style.transform = 'translateY(-1px) scale(1.02)';

  let prompt = SYSTEM_PROMPT + "\nUser: " + query + "\nAssistant:";

  // Adjust prompt based on mode
  switch(mode) {
    case 'novice':
      prompt = SYSTEM_PROMPT + `\nAnswer simply for a beginner in ${language}. Question: ${query}`;
      break;
    case 'proficient':
      prompt = SYSTEM_PROMPT + `\nGive a technical but concise explanation in ${language}. Question: ${query}`;
      break;
    case 'expert':
      prompt = SYSTEM_PROMPT + `\nProvide a research-level explanation in ${language}. Question: ${query}`;
      break;
  }

  try {
    const response = await puter.ai.chat(prompt, { model: "gpt-4o" });
    addMessage('ai', response);
  } catch (error) {
    addMessage('ai', 'Connection error. Please try again.');
  } finally {
    loadingSpinner.style.display = 'none';
    sendButton.style.transform = '';
  }
}

    // Initialize map with enhanced animations
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    // Add zoom control to bottom right
    L.control.zoom({
      position: 'bottomright'
    }).addTo(map);

    // Enhanced ARGO data loading with animations
    async function loadArgoData() {
      try {
        const response = await fetch('https://argovis-api.colorado.edu/argo');
        const data = await response.json();

        data.slice(0, 100).forEach((float, index) => {
          if (float.lat && float.lon) {
            setTimeout(() => {
              const marker = L.circleMarker([float.lat, float.lon], {
                radius: 5,
                fillColor: index % 3 === 0 ? '#3b82f6' : index % 3 === 1 ? '#0891b2' : '#7c3aed',
                color: index % 3 === 0 ? '#1d4ed8' : index % 3 === 1 ? '#0e7490' : '#5b21b6',
                weight: 2,
                opacity: 0.9,
                fillOpacity: 0.7
              });

              marker.bindPopup(`
                <div style="font-family: 'SF Pro Display', sans-serif; font-size: 0.875rem; backdrop-filter: blur(10px);">
                  <div style="font-weight: 600; margin-bottom: 8px; color: #3b82f6;">ARGO Float</div>
                  <div>ID: ${float.platform_number || 'Unknown'}</div>
                  <div>Position: ${float.lat.toFixed(2)}°, ${float.lon.toFixed(2)}°</div>
                  <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(59, 130, 246, 0.3); font-size: 0.75rem; color: #a3a3d3;">
                    Real-time ocean data
                  </div>
                </div>
              `);

              // Add pulsing animation to markers
              const element = marker.getElement();
              if (element) {
                element.style.animation = `markerPulse 3s ease-in-out infinite`;
                element.style.animationDelay = `${index * 50}ms`;
              }

              marker.addTo(map);
            }, index * 20); // Stagger the appearance
          }
        });
      } catch (error) {
        console.error('Error loading ARGO data:', error);
      }
    }

    // Add marker pulse animation
    const markerStyle = document.createElement('style');
    markerStyle.textContent = `
      @keyframes markerPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
      }
    `;
    document.head.appendChild(markerStyle);

    loadArgoData();

    // Map search functionality
    async function searchLocation() {
      const query = document.getElementById('mapSearch').value.trim();
      if (!query) return;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await response.json();
        
        if (data.length > 0) {
          const { lat, lon } = data[0];
          map.flyTo([parseFloat(lat), parseFloat(lon)], 6, {
            animate: true,
            duration: 1.5
          });
          
          // Add a temporary marker for the searched location
          const searchMarker = L.marker([parseFloat(lat), parseFloat(lon)], {
            icon: L.divIcon({
              className: 'search-marker',
              html: '📍',
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            })
          }).addTo(map);
          
          searchMarker.bindPopup(`
            <div style="font-family: 'SF Pro Display', sans-serif; font-size: 0.875rem;">
              <div style="font-weight: 600; margin-bottom: 8px; color: #3b82f6;">Search Result</div>
              <div>${data[0].display_name}</div>
            </div>
          `).openPopup();
          
          // Remove marker after 10 seconds
          setTimeout(() => {
            map.removeLayer(searchMarker);
          }, 10000);
        }
      } catch (error) {
        console.error('Search error:', error);
      }
    }

    // Add enter key support for map search
    document.getElementById('mapSearch').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchLocation();
      }
    });

    // Enhanced export report with animations and proper PDF generation
    function exportReport() {
      const exportBtn = document.querySelector('.btn-success');
      const originalText = exportBtn.textContent;
      
      exportBtn.textContent = 'Generating...';
      exportBtn.style.background = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
      
      setTimeout(() => {
        try {
          // Check if jsPDF is available
          if (typeof jspdf !== 'undefined') {
            const doc = new jspdf.jsPDF();
            
            // Enhanced PDF styling
            doc.setFillColor(10, 10, 26);
            doc.rect(0, 0, 210, 297, 'F');
            
            // Title with gradient effect simulation
            doc.setTextColor(59, 130, 246);
            doc.setFontSize(24);
            doc.text('FloatChat Report', 20, 30);
            
            // Subtitle
            doc.setTextColor(163, 163, 211);
            doc.setFontSize(12);
            doc.text('AI Ocean Intelligence Platform', 20, 40);
            
            // Date
            doc.setTextColor(82, 82, 162);
            doc.setFontSize(10);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 50);
            
            // Decorative line
            doc.setDrawColor(37, 99, 235);
            doc.setLineWidth(0.5);
            doc.line(20, 55, 190, 55);
            
            // Messages
            const messages = chat.querySelectorAll('.message');
            let y = 70;
            
            doc.setFontSize(14);
            doc.setTextColor(255, 255, 255);
            doc.text('Conversation Log', 20, y);
            y += 15;
            
            messages.forEach(msg => {
              const isUser = msg.classList.contains('user');
              const text = msg.lastChild.textContent;
              
              doc.setFontSize(10);
              doc.setTextColor(isUser ? 59 : 163, isUser ? 130 : 163, isUser ? 246 : 211);
              doc.text(`${isUser ? 'User' : 'AI'}: `, 20, y);
              
              doc.setTextColor(255, 255, 255);
              const splitText = doc.splitTextToSize(text, 160);
              doc.text(splitText, 40, y);
              y += splitText.length * 6 + 8;
              
              if (y > 270) {
                doc.addPage();
                doc.setFillColor(10, 10, 26);
                doc.rect(0, 0, 210, 297, 'F');
                y = 20;
              }
            });

            // Add map screenshot if available
            try {
              // This would require html2canvas or similar library
              // For now, we'll just add a placeholder
              if (y > 250) {
                doc.addPage();
                y = 20;
              }
              
              doc.setTextColor(59, 130, 246);
              doc.setFontSize(14);
              doc.text('ARGO Network Map', 20, y);
              y += 10;
              
              doc.setTextColor(163, 163, 211);
              doc.setFontSize(10);
              doc.text('Map visualization of active ARGO floats (screenshot not available)', 20, y);
            } catch (e) {
              console.log('Map screenshot not available');
            }

            doc.save('floatchat-report.pdf');
            
            // Success animation
            exportBtn.textContent = '✓ Exported';
            exportBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            
            // Show success message in chat
            addMessage('ai', 'Report exported successfully! The PDF includes our conversation and ARGO network information.');
            
          } else {
            throw new Error('PDF library not loaded');
          }
        } catch (error) {
          console.error('Export error:', error);
          
          // Error state
          exportBtn.textContent = '✗ Failed';
          exportBtn.style.background = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
          
          // Show error message in chat
          addMessage('ai', 'Sorry, there was an error exporting the report. Please try again later.');
        }
        
        // Reset button after delay
        setTimeout(() => {
          exportBtn.textContent = originalText;
          exportBtn.style.background = '';
        }, 3000);
      }, 1000);
    }

    // Alternative export formats
    function exportAsText() {
      const messages = chat.querySelectorAll('.message');
      let textContent = 'FloatChat Conversation Report\n';
      textContent += 'Generated: ' + new Date().toLocaleString() + '\n\n';
      
      messages.forEach(msg => {
        const isUser = msg.classList.contains('user');
        const text = msg.lastChild.textContent;
        textContent += `${isUser ? 'User' : 'AI'}: ${text}\n\n`;
      });
      
      const blob = new Blob([textContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'floatchat-conversation.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Add export menu to the controls
    function addExportMenu() {
      const exportBtn = document.querySelector('.btn-success');
      exportBtn.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        
        // Create export menu
        const menu = document.createElement('div');
        menu.style.cssText = `
          position: absolute;
          background: rgba(23, 23, 51, 0.95);
          backdrop-filter: blur(20px);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 8px;
          z-index: 1000;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
          min-width: 150px;
        `;
        
        menu.innerHTML = `
          <div style="padding: 8px 12px; cursor: pointer; border-radius: 6px; transition: background 0.2s;" 
               onmouseover="this.style.background='rgba(59, 130, 246, 0.2)'" 
               onmouseout="this.style.background='transparent'"
               onclick="exportReport()">Export as PDF</div>
          <div style="padding: 8px 12px; cursor: pointer; border-radius: 6px; transition: background 0.2s;" 
               onmouseover="this.style.background='rgba(59, 130, 246, 0.2)'" 
               onmouseout="this.style.background='transparent'"
               onclick="exportAsText()">Export as Text</div>
        `;
        
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
        
        document.body.appendChild(menu);
        
        // Remove menu on click outside
        const removeMenu = () => {
          document.body.removeChild(menu);
          document.removeEventListener('click', removeMenu);
        };
        setTimeout(() => document.addEventListener('click', removeMenu), 100);
      });
    }

    // Initialize export menu when DOM is loaded
    document.addEventListener('DOMContentLoaded', addExportMenu);

    // Enhanced input interactions
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Add input focus animations
    userInput.addEventListener('focus', () => {
      userInput.parentElement.style.transform = 'translateY(-2px)';
    });

    userInput.addEventListener('blur', () => {
      userInput.parentElement.style.transform = '';
    });

    // Add typing indicator animation
    userInput.addEventListener('input', () => {
      const typingIndicator = document.querySelector('.status');
      typingIndicator.style.color = '#3b82f6';
      setTimeout(() => {
        typingIndicator.style.color = '';
      }, 500);
    });

    // Add smooth page transitions
    document.addEventListener('DOMContentLoaded', () => {
      document.body.style.opacity = '0';
      setTimeout(() => {
        document.body.style.transition = 'opacity 0.6s ease';
        document.body.style.opacity = '1';
      }, 100);
    });

    // Add interactive hover effects for panels
    const panels = document.querySelectorAll('.panel');
    panels.forEach(panel => {
      panel.addEventListener('mouseenter', () => {
        panel.style.boxShadow = '0 25px 50px rgba(0, 0, 0, 0.4), 0 0 50px rgba(37, 99, 235, 0.15)';
      });
      
      panel.addEventListener('mouseleave', () => {
        panel.style.boxShadow = '';
      });
    });
    

    // Dynamic background animation based on user activity
    let activityTimeout;
    function resetActivityTimer() {
      clearTimeout(activityTimeout);
      document.body.style.animationDuration = '10s';
      activityTimeout = setTimeout(() => {
        document.body.style.animationDuration = '20s';
      }, 30000);
    }

    document.addEventListener('mousemove', resetActivityTimer);
    document.addEventListener('keypress', resetActivityTimer);
    document.addEventListener('click', resetActivityTimer);

    resetActivityTimer();

  </script>
</body>
</html>
