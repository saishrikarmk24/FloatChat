<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloatChat - AI Ocean Intelligence</title>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0a0a0a;
      --secondary: #1a1a1a;
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --surface: #0f0f0f;
      --surface-light: #171717;
      --text-primary: #ffffff;
      --text-secondary: #a3a3a3;
      --text-muted: #525252;
      --border: #262626;
      --border-light: #404040;
      --success: #10b981;
      --warning: #f59e0b;
      --glow-blue: rgba(37, 99, 235, 0.5);
      --glow-white: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Sleek scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      gap: 24px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 48px 0;
      position: relative;
    }

    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .header p {
      font-size: 1.125rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: -0.01em;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    /* Main Grid */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 70vh;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glow-white), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .panel:hover::before {
      opacity: 1;
    }

    .panel:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
    }

    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-light);
    }

    .panel-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      animation: messageIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      background: var(--accent);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    .message.ai {
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message-sender {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Map Panel */
    #map {
      height: 100%;
      background: var(--surface);
    }

    /* Controls */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    #userInput {
      width: 100%;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 1rem;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
    }

    #userInput::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow-blue);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--border-light);
      box-shadow: 0 4px 12px var(--glow-white);
    }

    .btn-success {
      background: var(--success);
    }

    .btn-success:hover {
      background: #059669;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }

    .select-wrapper {
      position: relative;
    }

    select {
      appearance: none;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 40px 16px 20px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow-blue);
    }

    .select-wrapper::after {
      content: '▼';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.75rem;
      pointer-events: none;
    }

    /* Loading State */
    .loading {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--surface-light);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Status Indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .main-content {
        grid-template-columns: 1fr;
        height: auto;
        gap: 32px;
      }
      
      .panel {
        min-height: 60vh;
      }
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 16px;
        gap: 16px;
      }
      
      .header {
        padding: 32px 0;
      }
      
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      
      .input-group {
        min-width: auto;
      }
      
      .btn, select {
        padding: 14px 20px;
      }
      
      #chat {
        padding: 16px;
      }
      
      .message {
        max-width: 90%;
        padding: 12px 16px;
      }
    }

    /* Custom Leaflet Styles */
    .leaflet-container {
      background: var(--surface) !important;
      font-family: 'SF Pro Display', sans-serif !important;
    }

    .leaflet-popup-content-wrapper {
      background: var(--surface-light) !important;
      color: var(--text-primary) !important;
      border-radius: 12px !important;
      border: 1px solid var(--border) !important;
    }

    .leaflet-popup-tip {
      background: var(--surface-light) !important;
      border: 1px solid var(--border) !important;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>FloatChat</h1>
      <p>AI Ocean Intelligence Platform</p>
    </header>

    <main class="main-content">
      <div class="panel chat-panel">
        <div class="panel-header">
          <h2 class="panel-title">AI Assistant</h2>
          <div class="status">
            <div class="status-dot"></div>
            Online
          </div>
        </div>
        <div id="chat"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">ARGO Network</h2>
        </div>
        <div id="map"></div>
      </div>
    </main>

    <div class="controls">
      <div class="input-group">
        <input 
          id="userInput" 
          placeholder="Ask about ocean data, ARGO floats, marine science..."
          autocomplete="off"
        />
      </div>
      
      <button class="btn" onclick="sendMessage()">
        Send
        <div class="loading" id="loadingSpinner"></div>
      </button>

      <div class="select-wrapper">
        <select id="mode">
          <option value="novice">Novice</option>
          <option value="proficient">Proficient</option>
          <option value="expert">Expert</option>
        </select>
      </div>

      <button class="btn btn-success" onclick="exportReport()">
        Export
      </button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // Initialize with welcome message
    setTimeout(() => {
      addMessage('ai', 'Welcome to FloatChat. I can help you explore oceanographic data, analyze ARGO float measurements, and answer questions about marine science.');
    }, 800);

    function addMessage(type, content) {
      const message = document.createElement('div');
      message.className = `message ${type}`;
      
      const sender = document.createElement('div');
      sender.className = 'message-sender';
      sender.textContent = type === 'user' ? 'You' : 'Assistant';
      
      const text = document.createElement('div');
      text.textContent = content;
      
      message.appendChild(sender);
      message.appendChild(text);
      chat.appendChild(message);
      
      chat.scrollTop = chat.scrollHeight;
    }
    const SYSTEM_PROMPT = `
You are FloatChat, an AI Ocean Data Assistant.
- Always answer as a marine science expert.
- Focus on ARGO floats, ocean data, climate, salinity, temperature, and marine research.
- If the user just says hi/hello, greet them naturally: e.g. "Hi! How can I help with ocean data today?"
- Do not explain English words unless explicitly asked.
- Adapt your answers to the chosen mode (novice, proficient, expert).
`;

    async function sendMessage() {
      const query = userInput.value.trim();
      const mode = document.getElementById('mode').value;
      
      if (!query) return;

      addMessage('user', query);
      userInput.value = '';
      
      loadingSpinner.style.display = 'block';

      let prompt = SYSTEM_PROMPT + "\nUser: " + query + "\nAssistant:";

switch(mode) {
  case 'novice':
    prompt = SYSTEM_PROMPT + "\nAnswer simply for a beginner. Question: " + query;
    break;
  case 'proficient':
    prompt = SYSTEM_PROMPT + "\nGive a technical but concise explanation. Question: " + query;
    break;
  case 'expert':
    prompt = SYSTEM_PROMPT + "\nProvide a research-level explanation. Question: " + query;
    break;
}
      try {
        const response = await puter.ai.chat(prompt, { model: "gpt-4o" });
        addMessage('ai', response);
      } catch (error) {
        addMessage('ai', 'Connection error. Please try again.');
      } finally {
        loadingSpinner.style.display = 'none';
      }
    }

    // Initialize map
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    // Add zoom control to bottom right
    L.control.zoom({
      position: 'bottomright'
    }).addTo(map);

    // Load ARGO data
    async function loadArgoData() {
      try {
        const response = await fetch('https://argovis-api.colorado.edu/argo');
        const data = await response.json();

        data.slice(0, 100).forEach(float => {
          if (float.lat && float.lon) {
            const marker = L.circleMarker([float.lat, float.lon], {
              radius: 4,
              fillColor: '#3b82f6',
              color: '#1d4ed8',
              weight: 1,
              opacity: 0.8,
              fillOpacity: 0.6
            });

            marker.bindPopup(`
              <div style="font-family: 'SF Pro Display', sans-serif; font-size: 0.875rem;">
                <div style="font-weight: 600; margin-bottom: 8px;">ARGO Float</div>
                <div>ID: ${float.platform_number || 'Unknown'}</div>
                <div>Position: ${float.lat.toFixed(2)}°, ${float.lon.toFixed(2)}°</div>
              </div>
            `);

            marker.addTo(map);
          }
        });
      } catch (error) {
        console.error('Error loading ARGO data:', error);
      }
    }

    loadArgoData();

    // Export report
    function exportReport() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Title
      doc.setFontSize(18);
      doc.text('FloatChat Report', 20, 25);
      
      // Date
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 35);
      
      // Messages
      const messages = chat.querySelectorAll('.message');
      let y = 50;
      
      messages.forEach(msg => {
        const isUser = msg.classList.contains('user');
        const text = msg.lastChild.textContent;
        
        doc.setFontSize(10);
        doc.text(`${isUser ? 'User' : 'AI'}: ${text}`, 20, y);
        y += 15;
        
        if (y > 270) {
          doc.addPage();
          y = 20;
        }
      });

      doc.save('floatchat-report.pdf');
    }

    // Enter key support
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>

</html>
